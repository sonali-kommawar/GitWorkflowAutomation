<!DOCTYPE html>
<html>
<head>
<title>Team Task Dashboard</title>

<style>
body{
    font-family:Arial;
    background:#f4f6f8;
    text-align:center;
}

.container{
    width:70%;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0px 0px 10px gray;
}

button{
    padding:6px 10px;
    margin:3px;
}

.todo{color:red;}
.doing{color:orange;}
.done{color:green;}
</style>
</head>

<body>

<div class="container">

<h2>🚀 Team Task Dashboard</h2>

<form action="/add_task" method="POST">
    <input name="title" placeholder="Task Name" required>
    <input name="assigned" placeholder="Assign To" required>
    <button>Add Task</button>
</form>

<hr>

<h3>Team Tasks</h3>

<table border="1" width="100%">
<tr>
<th>ID</th>
<th>Task</th>
<th>Assigned</th>
<th>Status</th>
<th>Actions</th>
</tr>

{% for task in tasks %}
<tr>
<td>{{task.id}}</td>
<td>{{task.title}}</td>
<td>{{task.assigned_to}}</td>

<td class="
{% if task.status=='Todo' %}todo
{% elif task.status=='Doing' %}doing
{% else %}done
{% endif %}
">
{{task.status}}
</td>

<td>
<a href="/update/{{task.id}}">
<button>Update</button>
</a>

<a href="/delete/{{task.id}}">
<button>Delete</button>
</a>
</td>
</tr>
{% endfor %}

</table>

<hr>

<h3>⚙ DevOps Automation Status</h3>
<p>✅ Git Pull Synced</p>
<p>✅ Git Push Enabled</p>
<p>✅ CI Pipeline Automated</p>

</div>

</body>
</html>
