<!DOCTYPE html>
<html>
<head>
    <title>Git Workflow Automation for Teams</title>

    <style>
        body{
            font-family: Arial;
            background:#f4f6f8;
            text-align:center;
        }

        .container{
            width:60%;
            margin:auto;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        input{
            padding:10px;
            width:60%;
        }

        button{
            padding:10px 15px;
            background:#28a745;
            color:white;
            border:none;
            cursor:pointer;
        }

        li{
            text-align:left;
            margin:8px;
        }

        .status{
            color:green;
            font-weight:bold;
        }
    </style>
</head>

<body>

<div class="container">

<h2>🚀 Team Task Dashboard</h2>
<p>Git Workflow Automation for Teams</p>

<form action="/add" method="POST">
    <input type="text" name="task" placeholder="Enter Team Task">
    <button type="submit">Add</button>
</form>

<hr>

<h3>Team Tasks</h3>

<ul>
    {% for task in tasks %}
        <li>
            {{ task }}
            <span class="status">✔ Synced with Git</span>
        </li>
    {% endfor %}
</ul>

<hr>

<h3>Automation Status</h3>

<p>✅ Git Pull : Latest Code Updated</p>
<p>✅ Git Push : Changes Uploaded</p>
<p>✅ CI Pipeline : Running Automatically</p>

</div>

</body>
</html>
