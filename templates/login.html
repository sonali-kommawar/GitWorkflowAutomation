<!DOCTYPE html>
<html>
<head>
    <title>Git Workflow Automation for Teams</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#4f525d,#6a686d,#c7acb1);
            background-size:400% 400%;
            animation:gradientMove 10s infinite alternate;
        }

        @keyframes gradientMove{
            0%{background-position:left;}
            100%{background-position:right;}
        }

        .login-box{
            background:rgba(255,255,255,0.15);
            backdrop-filter:blur(12px);
            padding:40px;
            border-radius:15px;
            width:380px;
            text-align:center;
            color:white;
            box-shadow:0 10px 30px rgba(0,0,0,0.3);
        }

        h1{
            margin-bottom:10px;
            font-size:26px;
        }

        .subtitle{
            font-size:14px;
            margin-bottom:25px;
            opacity:0.9;
        }

        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border:none;
            border-radius:8px;
            outline:none;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#00c9a7;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#00a389;
            transform:scale(1.05);
        }

        .features{
            margin-top:25px;
            text-align:left;
            font-size:13px;
        }

        .features p{
            margin:5px 0;
        }

        .footer{
            margin-top:20px;
            font-size:12px;
            opacity:0.8;
        }

    </style>
</head>

<body>

<div class="login-box">

    <h1>🚀 Git Workflow Automation</h1>
    <p class="subtitle">Team Collaboration & DevOps Management System</p>

    <form method="POST">
        <input name="username" placeholder="👤 Enter Team Member Name" required>
        <button type="submit">Login to Dashboard</button>
    </form>

    <div class="features">
        <h3>✨ Project Features</h3>
        <p>✅ Team Task Management</p>
        <p>✅ Git Push & Pull Automation</p>
        <p>✅ DevOps CI/CD Workflow</p>
        <p>✅ Status Tracking (Todo → Done)</p>
        <p>✅ Real-time Collaboration</p>
    </div>

    <div class="footer">
        Developed for DevOps Project • Team Automation System
    </div>

</div>

</body>
</html>
