<h2>Bug Tracking System</h2>

<form method="POST" action="/report_bug">
    <input name="title" placeholder="Bug Title">
    <input name="developer" placeholder="Assign Developer">
    <button>Report Bug</button>
</form>

<hr>

{% for bug in bugs %}
<p>
<b>{{bug.title}}</b> |
Assigned: {{bug.developer}} |
Status: {{bug.status}}
</p>
{% endfor %}
